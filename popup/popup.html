<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>extension popup</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <h1>YouTube Recommendations Filter</h1>
    <form>
      <div class="input-container">
        <div class="input-group">
          <label for="minViewsInput">Views:</label>
          <input type="number" id="minViewsInput" placeholder="Min views" name="minViews" min="0">
        </div>
        <div class="input-group">
          <input type="number" id="maxViewsInput" placeholder="Max views" name="maxViews" min="0">
        </div>
      </div>
    </form>
    <form>
      <div class="input-container">
        <label for="time-value">Posted within:</label>
        <input type="number" id="time-value" placeholder="Enter number" name="maxAge" min="0">
        <select name="time-unit" id="time-unit">
          <option value="select">select</option>
          <option value="seconds">seconds</option>
          <option value="minutes">minutes</option>
          <option value="hours">hours</option>
          <option value="days">days</option>
          <option value="weeks">weeks</option>
          <option value="months">months</option>
          <option value="years">years</option>
        </select>
      </div>
    </form>
    <form>
      <div class="input-container">
        <div class="input-group">
          <label for="minDurInput">Duration:</label>
          <input type="text" id="minDurInput" placeholder="Min: hr:min:sec" name="minDuration"><br>
        </div>
        <div class="input-group">
          <input type="text" id="maxDurInput" placeholder="Max: hr:min:sec" name="maxDuration"><br> 
      </div>
      </div>
    </form>
    <div class="button-container">
      <button id="clear" class="apply-button">Clear</button>
      <div id="error-message" class="error-message"></div>
      <button id="apply" class="apply-button">Apply</button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
